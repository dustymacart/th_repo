---
- name: Deploy website content to IIS
  hosts: "{{ target_group | default('winwebservers') }}"
  gather_facts: false

  vars:
    iis_site_name: pokemonindex
    iis_app_pool_name: pokemonindex
    iis_site_path: C:\inetpub\pokemonindex
    deployment_source: "{{ playbook_dir }}/../pokemon-source"
    deployment_staging_path: C:\Windows\Temp\th-pokemon-deploy

  pre_tasks:
    - name: Validate deployment settings
      ansible.builtin.assert:
        that:
          - iis_site_name | length > 0
          - iis_app_pool_name | length > 0
          - iis_site_path is match('(?i)^C:\\\\inetpub\\\\[^\\\\]+')
          - deployment_source | length > 0
          - deployment_staging_path is match('(?i)^C:\\\\Windows\\\\Temp\\\\[^\\\\]+')
          - deployment_staging_path | lower != iis_site_path | lower
        fail_msg: The IIS site, pool, destination, source, and staging path must be valid.

    - name: Verify deployment source exists on the Ansible controller
      ansible.builtin.stat:
        path: "{{ deployment_source }}"
      delegate_to: localhost
      become: false
      register: deployment_source_info

    - name: Require a deployment source directory
      ansible.builtin.assert:
        that:
          - deployment_source_info.stat.exists
          - deployment_source_info.stat.isdir
        fail_msg: "Deployment source directory {{ deployment_source }} does not exist."

    - name: Verify Ansible connectivity
      ansible.windows.win_ping:

  tasks:
    - name: Ensure the IIS content directory exists
      ansible.windows.win_file:
        path: "{{ iis_site_path }}"
        state: directory

    - name: Ensure the application pool uses ApplicationPoolIdentity
      microsoft.iis.web_app_pool:
        name: "{{ iis_app_pool_name }}"
        state: started
        attributes:
          processModel.identityType: ApplicationPoolIdentity

    - name: Grant the IIS application pool access to the content directory
      ansible.windows.win_acl:
        path: "{{ iis_site_path }}"
        user: "IIS AppPool\\{{ iis_app_pool_name }}"
        rights: ReadAndExecute,ListDirectory,Read
        type: allow
        state: present
        inherit: ContainerInherit, ObjectInherit
        propagation: "None"

    - name: Enable anonymous authentication as the application pool identity
      ansible.windows.win_powershell:
        parameters:
          SiteName: "{{ iis_site_name }}"
        script: |
          param([string]$SiteName)

          Import-Module WebAdministration
          $filter = 'system.webServer/security/authentication/anonymousAuthentication'
          $path = 'MACHINE/WEBROOT/APPHOST'
          $enabled = Get-WebConfigurationProperty `
            -PSPath $path `
            -Location $SiteName `
            -Filter $filter `
            -Name enabled
          $userName = Get-WebConfigurationProperty `
            -PSPath $path `
            -Location $SiteName `
            -Filter $filter `
            -Name userName

          $Ansible.Changed = $false
          if (-not [bool]$enabled.Value) {
              Set-WebConfigurationProperty `
                -PSPath $path `
                -Location $SiteName `
                -Filter $filter `
                -Name enabled `
                -Value $true
              $Ansible.Changed = $true
          }
          if ([string]$userName.Value -ne '') {
              Set-WebConfigurationProperty `
                -PSPath $path `
                -Location $SiteName `
                -Filter $filter `
                -Name userName `
                -Value ''
              $Ansible.Changed = $true
          }

    - name: Stage and mirror the repository artifact
      block:
        - name: Remove content from the previous deployment staging directory
          ansible.windows.win_file:
            path: "{{ deployment_staging_path }}"
            state: absent

        - name: Create a clean deployment staging directory
          ansible.windows.win_file:
            path: "{{ deployment_staging_path }}"
            state: directory

        - name: Upload the repository artifact to staging
          ansible.windows.win_copy:
            src: "{{ deployment_source }}/"
            dest: "{{ deployment_staging_path }}\\"
          register: website_upload_result

        - name: Mirror staged content while controlling the application pool
          block:
            - name: Stop the application pool for deployment
              microsoft.iis.web_app_pool:
                name: "{{ iis_app_pool_name }}"
                state: stopped

            - name: Mirror the repository into the IIS content directory
              community.windows.win_robocopy:
                src: "{{ deployment_staging_path }}"
                dest: "{{ iis_site_path }}"
                recurse: true
                purge: true
              register: website_mirror_result

          always:
            - name: Start the application pool after deployment
              microsoft.iis.web_app_pool:
                name: "{{ iis_app_pool_name }}"
                state: started

      always:
        - name: Remove the deployment staging directory
          ansible.windows.win_file:
            path: "{{ deployment_staging_path }}"
            state: absent

    - name: Ensure the website is started
      microsoft.iis.website:
        name: "{{ iis_site_name }}"
        state: started

  post_tasks:
    - name: Report deployment result
      ansible.builtin.debug:
        msg: >-
          Deployed {{ deployment_source }} to {{ iis_site_path }} on
          {{ inventory_hostname }} as an authoritative mirror. Files absent
          from the repository were removed. Content changed:
          {{ website_mirror_result.changed | default(false) | bool }}.
