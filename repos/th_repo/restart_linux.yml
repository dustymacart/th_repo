---
- name: Safely reboot Linux servers
  hosts: rhwebservers
  gather_facts: false
  become: true
  serial: "{{ reboot_batch_size | default(1) }}"

  pre_tasks:
    - name: Verify that the host is reachable before reboot
      ansible.builtin.wait_for_connection:
        connect_timeout: 10
        timeout: 60

    - name: Gather minimal facts
      ansible.builtin.setup:
        gather_subset:
          - min

    - name: Confirm that the target is Linux
      ansible.builtin.assert:
        that:
          - ansible_system == 'Linux'
        fail_msg: "{{ inventory_hostname }} is not recognized as a Linux host; refusing to reboot it."

  tasks:
    - name: Reboot and wait for Linux to return
      ansible.builtin.reboot:
        msg: Reboot initiated by Ansible through Jenkins
        pre_reboot_delay: 5
        post_reboot_delay: 10
        connect_timeout: 10
        reboot_timeout: 900
        test_command: whoami

  post_tasks:
    - name: Verify Ansible connectivity after reboot
      ansible.builtin.ping: