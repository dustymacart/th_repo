---
- name: Configure domain Linux administrators sudo access
  hosts: redhat_servers
  become: true
  gather_facts: false

  tasks:
    - name: Create domain-admin sudoers policy
      ansible.builtin.copy:
        content: |
          %role_linux_admin@digitalcanyon.org ALL=(ALL:ALL) ALL
        dest: /etc/sudoers.d/domain-admin
        owner: root
        group: root
        mode: "0440"
        validate: /usr/sbin/visudo -cf %s