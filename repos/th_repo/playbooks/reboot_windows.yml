---
- name: Reboot Windows servers
  hosts: "{{ target_group | mandatory('target_group is required') }}"
  gather_facts: false
  serial: "{{ reboot_batch_size | default(1) }}"

  tasks:
    - name: Reboot and wait for the server to return
      ansible.windows.win_reboot:
        msg: "Reboot initiated by Ansible for scheduled maintenance"
        reboot_timeout: 1800
        post_reboot_delay: 30
